<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in - DVR Bridge</title><link rel="stylesheet" href="/static/style.css">
</head><body>
<main>
  <div class="card">
    <h2>DVR Bridge</h2>
    <p class="err" id="error" hidden></p>
    <p class="hint" id="setup" hidden>No accounts yet. <a href="/setup">Create the admin account</a>.</p>

    <form id="pw" hidden>
      <label for="username">Username</label>
      <input type="text" id="username" autocomplete="username" autocapitalize="none" required>
      <label for="password">Password</label>
      <input type="password" id="password" autocomplete="current-password" required>
      <div class="actions"><button class="primary" type="submit">Log in</button></div>
    </form>

    <form id="mfa" hidden>
      <p class="hint">Enter the 6-digit code from your authenticator app.</p>
      <label for="code">Code</label>
      <input type="text" id="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9 ]{6,7}" maxlength="7" required>
      <div class="actions"><button class="primary" type="submit">Verify</button><a href="/login">Start again</a></div>
    </form>

    <div id="sso" hidden>
      <p class="or" id="or" hidden>or</p>
      <div class="actions"><a class="btn" id="ssoButton" href="/auth/oidc/start"></a></div>
    </div>
  </div>
</main>
<script src="/static/login.js"></script>
</body></html>
