name: Bug report
description: Something does not work as described.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Security problem? Please do not open an issue - see SECURITY.md for private reporting.
        Do not paste passwords, tokens, cookies, public IP addresses, serial numbers or MAC addresses.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations: { required: true }
  - type: textarea
    id: steps
    attributes:
      label: How to reproduce
  - type: input
    id: version
    attributes:
      label: DVR Bridge version
      description: Shown at the bottom of Settings > System, or the image tag you run.
    validations: { required: true }
  - type: input
    id: dvr
    attributes:
      label: DVR model and firmware
  - type: dropdown
    id: auth
    attributes:
      label: Login method (auth.mode)
      options: [local, oidc, header, none]
  - type: textarea
    id: logs
    attributes:
      label: Relevant log lines
      description: From `docker logs dvr-bridge`. Check them for secrets first.
      render: text
