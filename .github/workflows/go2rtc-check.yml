name: go2rtc version check

# go2rtc is added to the image by URL and checksum (Dockerfile), which Dependabot cannot see.
# This fails - and so notifies the maintainers - when a newer go2rtc release exists, as a prompt
# to read its release notes and update the version and both checksums.
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compare the pinned go2rtc with the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pinned="$(grep -o 'go2rtc/releases/download/v[0-9.]*' Dockerfile | head -1 | sed 's#.*/##')"
          latest="$(gh api repos/AlexxIT/go2rtc/releases/latest --jq .tag_name)"
          echo "pinned: $pinned  latest: $latest"
          test -n "$pinned" && test -n "$latest"
          if [ "$pinned" != "$latest" ]; then
            echo "::error::go2rtc $latest is available (image has $pinned). Review its release notes, then update the version and both sha256 checksums in the Dockerfile."
            exit 1
          fi
